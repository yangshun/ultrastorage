catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
  '@vitest/coverage-v8': 5.0.5
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  # Match Blume's plugin pin and the Oxc peer version supported by @astrojs/react.
  '@astrojs/react>@vitejs/plugin-react': 6.1.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
